# Pinned actions, read-only token, no event text interpolated into shell commands.
name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check public export boundaries
        run: |
          python scripts/check_public.py --self-test
          python scripts/check_public.py
      - name: Check modpack source
        run: |
          python scripts/verify_modpack.py --self-test
          python scripts/verify_modpack.py
